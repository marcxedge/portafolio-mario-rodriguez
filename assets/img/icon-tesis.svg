<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- Back hand (left, slightly behind) -->
  <g fill="#5b21b6" transform="rotate(-15, 36, 60)">
    <!-- Palm -->
    <rect x="20" y="52" width="28" height="30" rx="8"/>
    <!-- Fingers -->
    <rect x="22" y="22" width="9"  height="34" rx="4.5"/>
    <rect x="32" y="18" width="9"  height="38" rx="4.5"/>
    <rect x="42" y="22" width="8"  height="34" rx="4"/>
    <rect x="51" y="30" width="7"  height="26" rx="3.5"/>
    <!-- Thumb -->
    <ellipse cx="16" cy="62" rx="7" ry="11" transform="rotate(-25,16,62)"/>
  </g>

  <!-- Front hand (right, on top) -->
  <g fill="#7c3aed" transform="rotate(12, 64, 62)">
    <!-- Palm -->
    <rect x="52" y="52" width="28" height="30" rx="8"/>
    <!-- Fingers -->
    <rect x="54" y="22" width="9"  height="34" rx="4.5"/>
    <rect x="64" y="18" width="9"  height="38" rx="4.5"/>
    <rect x="74" y="22" width="8"  height="34" rx="4"/>
    <rect x="83" y="30" width="7"  height="26" rx="3.5"/>
    <!-- Thumb -->
    <ellipse cx="84" cy="62" rx="7" ry="11" transform="rotate(25,84,62)"/>
  </g>
</svg>
